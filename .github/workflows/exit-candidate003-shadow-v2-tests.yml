name: EXIT-CAND-003 Shadow v2 Focused Tests
on:
  workflow_dispatch:
jobs:
  shadow-v2-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exit-cand-003-shadow-v2-no-time-cap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Compile isolated runner and module
        run: python -m py_compile exit_candidate003_shadow_v2.py run_exit_candidate003_shadow_v2.py
      - name: Run isolated shadow v2 tests
        run: python -m unittest discover -s tests -p 'test_exit_candidate003_shadow_v2.py' -v
