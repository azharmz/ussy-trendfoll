name: Repository Test Suite

on:
  pull_request:
    paths:
      - "tests/**"
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/repository-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pytest boto3 pyarrow
      - name: Run every repository test file
        run: python -m pytest -q tests
