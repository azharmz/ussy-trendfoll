name: Signal Engine Weekly Stage Temporal Audit

on:
  workflow_dispatch: {}
  push:
    branches:
      - research/exit-development-hypotheses
    paths:
      - "feature_engine.py"
      - "tests/test_weekly_stage_temporal.py"
      - ".github/workflows/audit-weekly-stage-temporal.yml"

jobs:
  weekly-stage-temporal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run weekly Stage temporal and holiday tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_weekly_stage_temporal.py
