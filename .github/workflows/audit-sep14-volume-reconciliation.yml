name: Signal Engine Sep14 Volume Reconciliation Audit
on:
  workflow_dispatch:
  push:
    branches: [research/exit-development-hypotheses]
    paths:
      - audit_sep14_volume_reconciliation.py
      - .github/workflows/audit-sep14-volume-reconciliation.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pyarrow boto3
      - name: Run Sep-14 historical volume reconciliation audit
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python audit_sep14_volume_reconciliation.py
      - uses: actions/upload-artifact@v4
        with:
          name: sep14-volume-reconciliation-${{ github.run_number }}
          path: audit_artifacts/sep14_volume_reconciliation/
          if-no-files-found: error
