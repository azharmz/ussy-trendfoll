name: EXIT-CAND-003 Untouched Validation
on:
  workflow_dispatch:
  push:
    branches: [research/exit-development-hypotheses]
    paths:
      - run_exit_candidate003_validation.py
      - tests/test_exit_candidate003_validation.py
      - docs/EXIT_CAND_003_VALIDATION_PROTOCOL.md
      - .github/workflows/exit-candidate003-validation.yml
jobs:
  validation:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt boto3 pyarrow
      - name: Run repository tests
        run: python -m unittest discover -s tests
      - name: Run untouched validation
        run: python run_exit_candidate003_validation.py
      - name: Publish summary
        if: always()
        run: |
          if [ -f artifacts/exit_candidate003_validation/summary.json ]; then
            echo '## EXIT-CAND-003 Untouched Validation' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/exit_candidate003_validation/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exit-candidate003-validation-${{ github.run_number }}
          path: artifacts/exit_candidate003_validation/
          if-no-files-found: warn
          retention-days: 90
