name: DIAG-003 Exit Risk Conversion

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/diag003-exit-risk-conversion
    paths:
      - run_diag003_exit_risk.py
      - research_history.py
      - signal_path_diagnostic.py
      - positions.py
      - docs/DIAG_003_EXIT_RISK_CONTRACT.md
      - .github/workflows/diag003-exit-risk.yml

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt boto3 pyarrow
      - name: Run repository tests
        run: python -m unittest discover -s tests
      - name: Run DIAG-003
        run: python run_diag003_exit_risk.py
      - name: Publish summary
        if: always()
        run: |
          if [ -f diag003_exit_risk_summary.json ]; then
            echo '## DIAG-003 Exit / Risk Conversion' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat diag003_exit_risk_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag003-exit-risk-${{ github.run_number }}
          path: |
            diag003_exit_risk_summary.json
            diag003_exit_risk_paths.csv
          if-no-files-found: warn
          retention-days: 90
