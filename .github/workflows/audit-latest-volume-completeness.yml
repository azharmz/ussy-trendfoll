name: Signal Engine Latest Volume Completeness Audit
on:
  workflow_dispatch:
  push:
    branches: [research/exit-development-hypotheses]
    paths:
      - audit_latest_volume_completeness.py
      - .github/workflows/audit-latest-volume-completeness.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pyarrow boto3
      - name: Run latest-volume completeness audit
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python audit_latest_volume_completeness.py
      - uses: actions/upload-artifact@v4
        with:
          name: latest-volume-completeness-${{ github.run_number }}
          path: audit_artifacts/latest_volume_completeness/
          if-no-files-found: error
