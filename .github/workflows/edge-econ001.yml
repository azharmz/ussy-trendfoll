name: EDGE-ECON-001 Economic Conversion
on:
  workflow_dispatch:
jobs:
  economic:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt boto3 pyarrow
      - name: Contract regression
        run: python -m unittest tests.test_edge_decomposition tests.test_exit_candidate003_validation tests.test_research_history
      - name: Economic conversion
        run: python run_edge_econ001.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-econ001-${{ github.run_number }}
          path: artifacts/edge_econ001/
          if-no-files-found: warn
          retention-days: 90
