name: Manual Production Stop-Loss Execution Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit dependencies
        run: python -m pip install --upgrade pip pandas pyarrow boto3

      - name: Read canonical READY and audit missing exit dates
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'ussy-data' }}
        run: python scripts/audit_all_stop_loss_execution.py

      - name: Upload read-only audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop-loss-execution-audit
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
