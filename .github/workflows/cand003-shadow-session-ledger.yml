name: CAND-003 Shadow Session Ledger

on:
  push:
    branches:
      - research/cand003-shadow-session-ledger
      - main
    paths:
      - 'exit_candidate003_shadow.py'
      - 'tests/test_exit_candidate003_shadow.py'
      - 'sql/schema_exit_candidate003_shadow_sessions.sql'
      - 'docs/CAND003_SHADOW_SESSION_LEDGER_IMPLEMENTATION.md'
      - '.github/workflows/cand003-shadow-session-ledger.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pandas numpy
      - name: Verify unittest discovery includes CAND-003 tests
        run: |
          python -m unittest discover -s tests -p 'test_exit_candidate003_shadow.py' -v 2>&1 | tee /tmp/cand003-tests.log
          grep -q 'test_gap_has_priority_and_fills_open' /tmp/cand003-tests.log
          grep -q 'test_identical_session_replay_is_idempotent' /tmp/cand003-tests.log
          grep -q 'test_divergent_duplicate_evidence_is_rejected' /tmp/cand003-tests.log
          grep -q 'test_rejects_late_bootstrap_without_creating_shadow' /tmp/cand003-tests.log
      - name: Compile shadow module
        run: python -m py_compile exit_candidate003_shadow.py
