name: PROB-019 research history contract

on:
  workflow_dispatch: {}
  push:
    branches:
      - architecture/research-history-contract
    paths:
      - research_history.py
      - run_research_history_contract_audit.py
      - tests/test_research_history.py
      - .github/workflows/audit-research-history-contract.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt boto3 pyarrow
      - name: Run repository tests
        run: python -m unittest discover -s tests
      - name: Run PROB-019 architecture audit
        run: python run_research_history_contract_audit.py
      - name: Publish summary
        if: always()
        run: |
          if [ -f research_history_contract_audit.json ]; then
            echo '## PROB-019 research history contract' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat research_history_contract_audit.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prob-019-research-history-${{ github.run_number }}
          path: research_history_contract_audit.json
          if-no-files-found: warn
          retention-days: 90
