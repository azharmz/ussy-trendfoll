name: PROB-019 research history contract

on:
  workflow_dispatch: {}
  push:
    branches:
      - architecture/verify-r2-history-prefix
    paths:
      - run_prob019_cctg_counterfactual.py
      - tests/test_prob019_cctg_counterfactual.py
      - .github/workflows/audit-research-history-contract.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest boto3 pyarrow
      - name: Run repository tests
        run: python -m pytest -q tests
      - name: Run read-only CCTG counterfactual
        run: python run_prob019_cctg_counterfactual.py
      - name: Run PROB-019 architecture audit
        if: github.event_name == 'workflow_dispatch'
        run: python run_research_history_contract_audit.py
      - name: Publish summary
        if: always()
        run: |
          for file in prob019_cctg_counterfactual.json research_history_contract_audit.json; do
            if [ -f "$file" ]; then
              echo "## $file" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prob-019-research-history-${{ github.run_number }}
          path: |
            prob019_cctg_counterfactual.json
            research_history_contract_audit.json
          if-no-files-found: warn
          retention-days: 90
