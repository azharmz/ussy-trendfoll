name: Signal Engine Benchmark Freshness Audit

on:
  workflow_dispatch: {}
  push:
    branches:
      - research/exit-development-hypotheses
    paths:
      - ".github/workflows/audit-benchmark-freshness.yml"
      - "audit_benchmark_freshness.py"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install boto3 pyarrow
      - name: Audit R2 versus benchmark freshness
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python audit_benchmark_freshness.py
      - name: Upload benchmark evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: signal-engine-benchmark-freshness-${{ github.run_number }}
          path: |
            benchmark_freshness_audit.json
            benchmark_freshness_audit.csv
          if-no-files-found: error
          retention-days: 90
