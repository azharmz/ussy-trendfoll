name: DIAG-002 Entry Attribution

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/diag002-entry-attribution
    paths:
      - run_diag002_entry_attribution.py
      - signal_path_diagnostic.py
      - research_history.py
      - hard_filter.py
      - decision_layer.py
      - feature_engine.py
      - docs/DIAG_002_ENTRY_ATTRIBUTION_CONTRACT.md
      - .github/workflows/diag002-entry-attribution.yml

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt boto3 pyarrow
      - name: Run repository tests
        run: python -m unittest discover -s tests
      - name: Run DIAG-002
        run: python run_diag002_entry_attribution.py
      - name: Publish summary
        if: always()
        run: |
          if [ -f diag002_entry_attribution_summary.json ]; then
            echo '## DIAG-002 Entry Attribution' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat diag002_entry_attribution_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag002-entry-attribution-${{ github.run_number }}
          path: |
            diag002_entry_attribution_summary.json
            diag002_entry_attribution_events.csv
          if-no-files-found: warn
          retention-days: 90
