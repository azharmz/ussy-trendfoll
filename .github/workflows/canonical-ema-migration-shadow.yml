name: Canonical EMA migration shadow

on:
  push:
    branches:
      - migration/shared-ema-adj
    paths:
      - 'r2_shared_ema.py'
      - 'r2_integration.py'
      - 'run_canonical_ema_migration_shadow.py'
      - 'tests/test_r2_shared_ema.py'
      - '.github/workflows/canonical-ema-migration-shadow.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt boto3 pyarrow
      - name: Run repository tests
        run: python -m unittest discover -s tests
      - name: Run canonical EMA migration shadow
        run: python run_canonical_ema_migration_shadow.py
      - name: Publish summary
        if: always()
        run: |
          if [ -f canonical_ema_migration_shadow.json ]; then
            echo '## Canonical EMA migration shadow' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat canonical_ema_migration_shadow.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-ema-migration-shadow-${{ github.run_number }}
          path: canonical_ema_migration_shadow.json
          if-no-files-found: warn
          retention-days: 90
