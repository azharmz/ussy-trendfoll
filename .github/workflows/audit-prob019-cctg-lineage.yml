name: PROB-019 CCTG history lineage audit

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lineage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt boto3 pyarrow pytest
      - name: Run repository tests
        run: python -m pytest -q
      - name: Inspect CCTG history lineage (read-only)
        run: python run_prob019_cctg_lineage_audit.py
      - name: Upload lineage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prob-019-cctg-lineage-${{ github.run_number }}
          path: prob019_cctg_lineage_audit.json
          if-no-files-found: warn
          retention-days: 90
