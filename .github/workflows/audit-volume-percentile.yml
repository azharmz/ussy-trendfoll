name: Volume Percentile Diagnostic Audit

on:
  push:
    branches:
      - research/exit-development-hypotheses
    paths:
      - audit_volume_percentile.py
      - .github/workflows/audit-volume-percentile.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pandas boto3 pyarrow
      - name: Run diagnostic audit
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python audit_volume_percentile.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: volume-percentile-audit-${{ github.run_number }}
          path: |
            volume_percentile_audit_summary.json
            volume_percentile_audit_targets.csv
          if-no-files-found: error
          retention-days: 90

