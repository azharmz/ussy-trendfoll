name: USSY TrendFoll — Daily Watchlist

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

# Operational smoke trigger: CAND-003 shadow ledger acceptance, 2026-09-16.
# This comment is intentionally non-functional; push runs the same daily pipeline.

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install boto3 pyarrow
      - name: Run daily pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python r2_main.py
      - name: Summarize NEAR_TRIGGER validation
        if: success()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metrics = json.loads(Path("near_trigger_validation_progress.json").read_text(encoding="utf-8"))
          verdict = metrics.get("verdict") or {}
          status = metrics.get("status", "UNKNOWN")
          lines = [
              "## NEAR_TRIGGER Cycle 1",
              "",
              f"**Status:** {status}",
              "",
              "| Evidence | Progress |",
              "|---|---:|",
              f"| Independent shadow episodes | {metrics.get('shadow_episodes', 0)} / {metrics.get('episode_target', 150)} |",
              f"| Unique tickers | {metrics.get('unique_symbols', 0)} / {metrics.get('unique_symbol_target', 75)} |",
              f"| Breakout onsets ≤ T+5 | {metrics.get('shadow_breakouts_5d', 0)} / {metrics.get('breakout_5d_target', 40)} |",
              f"| Control observations | {metrics.get('control_episodes', 0)} |",
              "",
              f"Validation starts from **{metrics.get('validation_start_date', '2026-09-15')}**. Threshold remains frozen at **0.60 ATR**.",
          ]
          if verdict:
              lift3 = verdict.get("lift_3d")
              lift5 = verdict.get("lift_5d")
              lines += [
                  "",
                  "### One-shot verdict metrics",
                  "",
                  f"- 3-day onset rate: {verdict.get('shadow_onset_rate_3d', 0):.1%}",
                  f"- 5-day onset rate: {verdict.get('shadow_onset_rate_5d', 0):.1%}",
                  f"- 3-day lift vs control: {lift3:.2f}x" if isinstance(lift3, (int, float)) else "- 3-day lift vs control: n/a",
                  f"- 5-day lift vs control: {lift5:.2f}x" if isinstance(lift5, (int, float)) else "- 5-day lift vs control: n/a",
              ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY
      - name: Upload NEAR_TRIGGER shadow snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: near-trigger-shadow-${{ github.run_number }}
          path: near_trigger_shadow_snapshot.csv
          if-no-files-found: error
          retention-days: 90
      - name: Upload NEAR_TRIGGER validation progress
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: near-trigger-validation-${{ github.run_number }}
          path: |
            near_trigger_validation_progress.json
            near_trigger_validation_episodes.csv
          if-no-files-found: error
          retention-days: 90
      - name: Upload candidate lifecycle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-lifecycle-${{ github.run_number }}
          path: candidate_lifecycle.csv
          if-no-files-found: error
          retention-days: 90
